{% extends "base.html" %}
{% load static %}

{% block title %}Mapa de Donaciones - DonaRed{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
<style>
    #map {
        height: 80vh;
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .container {
        padding: 2rem 0;
    }
    .page-title {
        color: #0056b3;
        margin-bottom: 2rem;
        font-family: 'Orbitron', sans-serif;
    }
    .map-container {
        background: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .popup-content {
        max-width: 300px;
    }
    .popup-image {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
    }
    .popup-title {
        color: #0056b3;
        font-weight: 600;
        margin-bottom: 5px;
    }
    .popup-description {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 10px;
    }
    .popup-button {
        background: linear-gradient(135deg, #0056b3, #003d82);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
        font-size: 0.9rem;
        transition: all 0.3s ease;
    }
    .popup-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 86, 179, 0.3);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center page-title">Mapa de Donaciones</h1>
    <div class="map-container">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar el mapa
        var map = L.map('map').setView([-34.6037, -58.3816], 13);
        
        // Agregar capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Crear grupo de marcadores
        var markers = L.markerClusterGroup();

        // Cargar datos GeoJSON
        fetch('{% url "geo_donaciones:items_geojson" %}')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function(feature, latlng) {
                        var marker = L.marker(latlng);
                        
                        // Crear contenido del popup
                        var popupContent = `
                            <div class="popup-content">
                                ${feature.properties.imagen ? 
                                    `<img src="${feature.properties.imagen}" class="popup-image" alt="${feature.properties.nombre}">` :
                                    `<img src="{% static 'images/default.jpg' %}" class="popup-image" alt="Imagen por defecto">`
                                }
                                <h5 class="popup-title">${feature.properties.nombre}</h5>
                                <p class="popup-description">${feature.properties.descripcion}</p>
                                <a href="/items/${feature.properties.id}/" class="popup-button">Ver detalles</a>
                            </div>
                        `;
                        
                        // Agregar popup
                        marker.bindPopup(popupContent);
                        
                        return marker;
                    }
                }).addTo(markers);
                
                map.addLayer(markers);
            });
    });
</script>
{% endblock %}
